dev_dependencies:
  flutter_test:
    sdk: flutter

    

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_foreground: assets/icons/pulse_icon_small.png
  adaptive_icon_background: assets/icons/pulse_bg.png
  remove_alpha_ios: true




flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/google_fonts/
    - assets/lottie/
  

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/google_fonts/DMSans_36pt-ExtraBold.ttf
          weight: 800

    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter_24pt-Regular.ttf
          weight: 400

    - family: Lato
      fonts:
        - asset: assets/google_fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Lato-Bold.ttf
          weight: 700

    - family: MonteCarlo
      fonts:
        - asset: assets/google_fonts/MonteCarlo-Regular.ttf
          weight: 400

    - family: Montserrat
      fonts:
        - asset: assets/google_fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Montserrat-Medium.ttf
          weight: 500

    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Poppins-ExtraBold.ttf
          weight: 800

