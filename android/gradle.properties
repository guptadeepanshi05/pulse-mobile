# ======================
# Gradle performance
# ======================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Gradle workaround for Firebase Messaging + Gradle 8
org.gradle.unsafe.configuration-cache=false
org.gradle.unsafe.isolated-projects=false

# JVM tuning (slightly safer than your original)
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# Gradle Kotlin DSL fails on JDK 25 ("IllegalArgumentException: 25.0.3").
# Force the Android build onto JDK 17 (already installed via Homebrew).
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# ======================
# Android
# ======================
android.useAndroidX=true
android.enableJetifier=true

# ======================
# Plugin-specific
# ======================
dev.steenbakker.mobile_scanner.useUnbundled=true